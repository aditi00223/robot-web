<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" data-state="idle">
    <section id="screen-idle" class="screen">
      <div class="eyes" id="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <p class="hint">Say "Hello Robo" to wake me</p>
      <div class="menu" id="menu" hidden>
        <button class="btn" id="btn-photo">1 &nbsp; Photo</button>
        <button class="btn" id="btn-directions">2 &nbsp; Directions</button>
      </div>
    </section>
    <section id="screen-photo" class="screen" hidden>
      <div class="camera-box">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="snap" hidden></canvas>
        <div id="countdown" class="countdown" hidden></div>
      </div>
      <div id="qr-box" class="qr-box" hidden>
        <div id="qr-code"></div>
        <p class="qr-url" id="qr-url"></p>
        <button class="btn" id="btn-done">Done</button>
      </div>
      <p class="hint" id="photo-hint">Please look at the camera</p>
    </section>
  </main>
  <script src="js/speak.js"></script>
  <script src="js/voice.js"></script><script src="js/camera.js"></script><script src="js/qrcode.js"></script><script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
